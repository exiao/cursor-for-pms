<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image - Claude Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .og-image {
            width: 100vw;
            height: 100vh;
            background: #f7f5f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 100px;
            position: relative;
            overflow: hidden;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: #1a1a1a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
        }

        .logo i {
            color: #f7f5f0;
            font-size: 32px;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 72px;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 40px;
        }

        .divider {
            width: 280px;
            height: 3px;
            background: #D97757;
            margin-bottom: 40px;
        }

        .subtitle {
            font-family: 'Source Serif 4', serif;
            font-size: 32px;
            color: #4a4a4a;
            margin-bottom: 48px;
            font-weight: 400;
        }

        .instructors {
            font-family: 'Source Serif 4', serif;
            font-size: 24px;
            color: #6a6a6a;
            letter-spacing: 0.02em;
        }

        .dot {
            color: #D97757;
            margin: 0 12px;
        }
    </style>
</head>
<body>
    <div class="og-image">
        <div class="logo">
            <i class="fa-solid fa-terminal"></i>
        </div>
        <h1 class="title">Claude Code for<br>Product Managers</h1>
        <div class="divider"></div>
        <p class="subtitle">Use coding agents for every part of your work</p>
        <p class="instructors">Aman Khan <span class="dot">·</span> Eric Xiao</p>
    </div>
</body>
</html>
